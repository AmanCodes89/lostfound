spring.application.name=lostfound
server.port=${PORT:8080}

# ---- Default: H2 file database (works without any setup) ----
spring.datasource.url=jdbc:h2:file:./data/lostfounddb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# ---- To use MySQL instead: comment the H2 lines above and uncomment these ----
# spring.datasource.url=jdbc:mysql://localhost:3306/lostfound?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=YOUR_PASSWORD
# spring.jpa.hibernate.ddl-auto=update

# ---- Dean office (admin) login. CHANGE the password before going live! ----
app.admin.name=Dean Office
app.admin.email=dean@college.com
app.admin.password=dean123

spring.thymeleaf.cache=false
